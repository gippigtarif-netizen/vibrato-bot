<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Вибрато Бот</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            overflow: hidden;
        }
        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 10px;
        }
        .status {
            font-size: 16px;
            font-weight: 600;
            color: #9ca3af;
            margin-bottom: 40px;
            padding: 8px 18px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        .status.active {
            color: #4ade80;
            background: rgba(34, 197, 94, 0.15);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.25);
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 320px;
        }
        .btn {
            width: 100%;
            padding: 20px;
            border-radius: 16px;
            border: none;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.2s ease;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-on {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #ffffff;
            box-shadow: 0 8px 25px rgba(34, 197, 94, 0.35);
        }
        .btn-off {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #ffffff;
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>

    <h1>Вибрато Бот</h1>
    <div id="statusBadge" class="status">Вибрация выключена</div>

    <div class="btn-group">
        <button class="btn btn-on" onclick="startVibration()">Включить вибрацию</button>
        <button class="btn btn-off" onclick="stopVibration()">Выключить вибрацию</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let isVibrating = false;
        let vibroInterval = null;

        function startVibration() {
            if (isVibrating) return; // Если уже включено, не дублируем цикл
            isVibrating = true;

            const status = document.getElementById('statusBadge');
            status.textContent = '📳 Вибрация работает...';
            status.classList.add('active');

            triggerVibe();
            // Повторяем каждую секунду, чтобы вибрация не прерывалась
            vibroInterval = setInterval(triggerVibe, 1000);
        }

        function triggerVibe() {
            // Непрерывная вибрация для Android
            if ("vibrate" in navigator) {
                navigator.vibrate(1000);
            }
            // Тактильный отклик Telegram для iOS
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('heavy');
            }
        }

        function stopVibration() {
            isVibrating = false;
            clearInterval(vibroInterval);

            if ("vibrate" in navigator) {
                navigator.vibrate(0); // Мгновенная остановка
            }

            const status = document.getElementById('statusBadge');
            status.textContent = 'Вибрация выключена';
            status.classList.remove('active');
        }
    </script>
</body>
</html>
