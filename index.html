<script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let isVibrating = false;
        let vibroInterval = null;
        let wakeLock = null;

        // Запрещаем экрану гаснуть, пока работает вибрация
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log('WakeLock не поддерживается:', err);
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release();
                wakeLock = null;
            }
        }

        function startVibration() {
            if (isVibrating) return;
            isVibrating = true;

            requestWakeLock();

            const status = document.getElementById('statusBadge');
            status.textContent = '📳 Вибрация работает...';
            status.classList.add('active');

            triggerVibe();
            // Короткие частые импульсы (каждые 450 мс) реже блокируются системой
            vibroInterval = setInterval(triggerVibe, 450);
        }

        function triggerVibe() {
            if ("vibrate" in navigator) {
                navigator.vibrate(400);
            }
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('heavy');
            }
        }

        function stopVibration() {
            isVibrating = false;
            clearInterval(vibroInterval);
            releaseWakeLock();

            if ("vibrate" in navigator) {
                navigator.vibrate(0);
            }

            const status = document.getElementById('statusBadge');
            status.textContent = 'Вибрация выключена';
            status.classList.remove('active');
        }
    </script>
