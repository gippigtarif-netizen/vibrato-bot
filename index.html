<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Вибрато Бот</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            overflow: hidden;
            user-select: none;
        }
        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 10px;
        }
        .status {
            font-size: 16px;
            font-weight: 600;
            color: #9ca3af;
            margin-bottom: 40px;
            padding: 8px 18px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
        }
        .status.active {
            color: #4ade80;
            background: rgba(34, 197, 94, 0.15);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.25);
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 320px;
        }
        .btn {
            width: 100%;
            padding: 20px;
            border-radius: 16px;
            border: none;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-on {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #ffffff;
            box-shadow: 0 8px 25px rgba(34, 197, 94, 0.35);
        }
        .btn-off {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #ffffff;
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>

    <h1>Вибрато Бот</h1>
    <div id="statusBadge" class="status">Вибрация выключена</div>

    <div class="btn-group">
        <button id="btnOn" class="btn btn-on">Включить вибрацию</button>
        <button id="btnOff" class="btn btn-off">Выключить вибрацию</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let isVibrating = false;
        let vibroTimer = null;
        let wakeLock = null;
        let audioCtx = null;

        // Определяем, iOS ли это (на iPhone navigator.vibrate отсутствует или не работает)
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

        function startKeepAliveAudio() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!audioCtx) audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                gainNode.gain.value = 0.0001;
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
            } catch (e) {}
        }

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator && !wakeLock) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (e) {}
        }

        function releaseWakeLock() {
            if (wakeLock) {
                wakeLock.release().catch(() => {});
                wakeLock = null;
            }
        }

        function runCycle() {
            if (!isVibrating) return;

            if (!isIOS && "vibrate" in navigator) {
                // На Android запускаем чистый 1-секундный гудок БЕЗ HapticFeedback
                navigator.vibrate(1000);
                vibroTimer = setTimeout(runCycle, 980);
            } else if (tg.HapticFeedback) {
                // На iPhone используем только нативный тактильный отклик
                tg.HapticFeedback.impactOccurred('heavy');
                vibroTimer = setTimeout(runCycle, 110);
            }
        }

        function startVibration() {
            if (isVibrating) return;
            isVibrating = true;

            startKeepAliveAudio();
            requestWakeLock();

            const status = document.getElementById('statusBadge');
            status.textContent = '📳 Вибрация работает...';
            status.classList.add('active');

            runCycle();
        }

        function stopVibration() {
            isVibrating = false;
            if (vibroTimer) {
                clearTimeout(vibroTimer);
                vibroTimer = null;
            }
            releaseWakeLock();

            if (!isIOS && "vibrate" in navigator) {
                navigator.vibrate(0);
            }
            if (audioCtx && audioCtx.state === 'running') {
                audioCtx.suspend().catch(() => {});
            }

            const status = document.getElementById('statusBadge');
            status.textContent = 'Вибрация выключена';
            status.classList.remove('active');
        }

        // Привязываем события напрямую к нажатию (pointerdown срабатывает мгновенно без задержек)
        document.getElementById('btnOn').addEventListener('pointerdown', startVibration);
        document.getElementById('btnOff').addEventListener('pointerdown', stopVibration);
    </script>
</body>
</html>
