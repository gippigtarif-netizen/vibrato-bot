<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Вибрато Бот</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at center, #111827 0%, #030712 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            overflow: hidden;
        }
        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 10px;
        }
        .status {
            font-size: 16px;
            font-weight: 600;
            color: #9ca3af;
            margin-bottom: 40px;
            padding: 8px 18px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        .status.active {
            color: #4ade80;
            background: rgba(34, 197, 94, 0.15);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.25);
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 320px;
        }
        .btn {
            width: 100%;
            padding: 20px;
            border-radius: 16px;
            border: none;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.15s ease;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-on {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #ffffff;
            box-shadow: 0 8px 25px rgba(34, 197, 94, 0.35);
        }
        .btn-off {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #ffffff;
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>

    <h1>Вибрато Бот</h1>
    <div id="statusBadge" class="status">Вибрация выключена</div>

    <div class="btn-group">
        <button class="btn btn-on" onclick="startVibration()">Включить вибрацию</button>
        <button class="btn btn-off" onclick="stopVibration()">Выключить вибрацию</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let isVibrating = false;
        let androidLoop = null;
        let iosLoop = null;
        let wakeLock = null;
        let audioCtx = null;

        // 1. Запускаем беззвучный аудиопоток, чтобы телефон не усыплял вкладку
        function startKeepAliveAudio() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!audioCtx) {
                    audioCtx = new AudioContext();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                gainNode.gain.value = 0.0001; // Почти нулевая громкость
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
            } catch (e) {}
        }

        // 2. Удерживаем экран активным
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (e) {}
        }

        function releaseWakeLock() {
            if (wakeLock) {
                wakeLock.release();
                wakeLock = null;
            }
        }

        // 3. Запуск бесконечного цикла
        function startVibration() {
            if (isVibrating) return;
            isVibrating = true;

            startKeepAliveAudio();
            requestWakeLock();

            const status = document.getElementById('statusBadge');
            status.textContent = '📳 Вибрация работает бесконечно...';
            status.classList.add('active');

            // Длинный непрерывный паттерн для Android (5 секунд гудка + 5 мс пауза, и так по кругу)
            const fireAndroid = () => {
                if (!isVibrating) return;
                if ("vibrate" in navigator) {
                    navigator.vibrate([5000, 5, 5000, 5]);
                }
            };
            fireAndroid();
            androidLoop = setInterval(fireAndroid, 9900);

            // Быстрый пулеметный тактильный отклик для iPhone (каждые 120 мс)
            const fireIOS = () => {
                if (!isVibrating) return;
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('heavy');
                }
            };
            fireIOS();
            iosLoop = setInterval(fireIOS, 120);
        }

        // 4. Полная остановка по кнопке
        function stopVibration() {
            isVibrating = false;
            clearInterval(androidLoop);
            clearInterval(iosLoop);
            releaseWakeLock();

            if ("vibrate" in navigator) {
                navigator.vibrate(0);
            }
            if (audioCtx && audioCtx.state === 'running') {
                audioCtx.suspend();
            }

            const status = document.getElementById('statusBadge');
            status.textContent = 'Вибрация выключена';
            status.classList.remove('active');
        }

        // Если экран случайно переключился и вернулся — восстанавливаем работу
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && isVibrating) {
                requestWakeLock();
                if ("vibrate" in navigator) {
                    navigator.vibrate([5000, 5, 5000, 5]);
                }
            }
        });
    </script>
</body>
</html>
